name: Run GENCODE Bump Dry Run

on:
  workflow_dispatch

permissions:
  id-token: write
  contents: write

jobs:
  gencode-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install -r scripts/schema_bump_dry_run_genes/requirements.txt
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_TO_ASSUME }}
          role-duration-seconds: 7200
      - name: Pull AWS Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids:
            AUTH0_SECRETS, corpora/backend/prod/auth0-secret
      - name: Run Dry-Run Script
        run: python3 -m scripts.schema_bump_dry_run_genes.gene_bump_dry_run
        env:
          corpus_env: "prod"
      - name: Upload report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genes-curator-report
          path: genes-curator-report.txt
          if-no-files-found: warn
      - name: upload to slack
        uses: ./.github/actions/slack-file-upload
        with:
          file: genes-curator-report.txt
          channel: ${{ secrets.SLACK_CURATOR_REPORTING_CHANNEL }}
          bot_token: ${{ secrets.SLACK_CURATOR_REPORTING_APP_AUTH }}
          initial_comment: Gene Dry Run Report
