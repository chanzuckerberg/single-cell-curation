name: Run Ontology Bump Dry Run

on:
  workflow_dispatch:
    inputs:
      schema_version:
        description: "Target schema version to evaluate deprecations against (must match an installed cellxgene-ontology-guide schema version, e.g. 7.1.0). Leave blank to use the cellxgene-schema package version on this branch."
        required: false
        default: ""

permissions:
  id-token: write
  contents: write

jobs:
  ontology-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install -r scripts/schema_bump_dry_run_ontologies/requirements.txt
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_TO_ASSUME }}
          role-duration-seconds: 2700
      - name: Pull AWS Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids:
            AUTH0_SECRETS, corpora/backend/prod/auth0-secret
      - name: Run Dry-Run Script
        run: python3 -m scripts.schema_bump_dry_run_ontologies.ontology_bump_dry_run
        env:
          corpus_env: "prod"
          schema_version: ${{ inputs.schema_version }}
      - name: Store JSON with Replaced By Ontology Term Mappings
        uses: actions/cache/save@v4
        with:
          path: "./replaced-by.json"
          key: replaced-by-map
      - name: Upload report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontologies-curator-report
          path: |
            ontologies-curator-report.txt
            replaced-by.json
          if-no-files-found: warn
      - name: upload dry run to slack
        uses: ./.github/actions/slack-file-upload
        with:
          file: ontologies-curator-report.txt
          channel: ${{ secrets.SLACK_CURATOR_REPORTING_CHANNEL }}
          bot_token: ${{ secrets.SLACK_CURATOR_REPORTING_APP_AUTH }}
          initial_comment: Ontology Dry Run Report
