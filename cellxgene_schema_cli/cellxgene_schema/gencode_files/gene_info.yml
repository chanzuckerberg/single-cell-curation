# Changes to this file trigger the gencode-process.yml GHA workflow, which regenerates genes_*.csv.gz files.
# Update a species' gtf_url/version here when the GTF annotation version bumps (e.g. GENCODE v48 -> v49).
# If the annotation bump is accompanied by a genome assembly change, also update gene_assembly.yml.
ercc:
  description: ercc
  gtf_url: https://assets.thermofisher.com/TFS-Assets/LSG/manuals/cms_095047.txt
human:
  description: homo_sapiens
  gtf_url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_{version}/gencode.v{version}.primary_assembly.annotation.gtf.gz
  version: 48
  perturbation_support: true
mouse:
  description: mus_musculus
  gtf_url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_{version}/gencode.v{version}.primary_assembly.annotation.gtf.gz
  version: M37
  perturbation_support: true
sars_cov_2:
  description: sars_cov_2
  gtf_url: ftp://ftp.ensemblgenomes.org/pub/viruses/gtf/sars_cov_2/Sars_cov_2.ASM985889v3.101.gtf.gz
fruit_fly:
  description: drosophila_melanogaster
  gtf_url: https://ftp.ensembl.org/pub/release-114/gtf/drosophila_melanogaster/Drosophila_melanogaster.BDGP6.54.114.gtf.gz
zebrafish:
  description: danio_rerio
  gtf_url: https://ftp.ensembl.org/pub/release-{version}/gtf/danio_rerio/Danio_rerio.GRCz11.{version}.gtf.gz
  version: 114
  perturbation_support: true
roundworm:
